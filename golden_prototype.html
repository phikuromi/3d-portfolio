<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><title>Золотой Прототип</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#02040a;font-family:sans-serif}
#hud{position:fixed;left:16px;top:14px;color:#cfe8ff;font-size:13px;letter-spacing:.08em;text-shadow:0 0 8px #3af;z-index:2}
#hud b{color:#ffd77a}#err{position:fixed;left:16px;bottom:16px;right:16px;color:#ff6b6b;font:13px monospace;white-space:pre-wrap;z-index:3}</style>
<script>
window.addEventListener('error',e=>{document.getElementById('err').textContent+='Ошибка: '+(e.message||e.target&&e.target.src)+'\n'},true);
window.addEventListener('unhandledrejection',e=>{document.getElementById('err').textContent+='Ошибка: '+e.reason+'\n'});
</script>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head><body><div id="hud"><b>ЗОЛОТОЙ ПРОТОТИП</b><br><span id="cnt">Загрузка Three.js…</span><br>мышь: вращение · колесо: зум</div><div id="err"></div>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';
import {UnrealBloomPass} from 'three/addons/postprocessing/UnrealBloomPass.js';
document.getElementById('cnt').textContent='Строю остров…';

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.shadowMap.enabled=true;
document.body.appendChild(renderer.domElement);
const scene=new THREE.Scene();scene.fog=new THREE.FogExp2(0x02040a,0.0045);
const camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,0.1,2000);camera.position.set(95,55,110);
const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.target.set(0,8,0);controls.autoRotate=true;controls.autoRotateSpeed=0.4;

scene.add(new THREE.HemisphereLight(0xbfdcff,0x1a1208,0.8));
const sun=new THREE.DirectionalLight(0xfff1d6,2.2);sun.position.set(60,120,40);sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-80,right:80,top:80,bottom:-80,far:300});scene.add(sun);
const coreLight=new THREE.PointLight(0x33aaff,900,140,1.6);coreLight.position.set(0,14,0);scene.add(coreLight);

let total=0;const box=new THREE.BoxGeometry(1,1,1);
const M=new THREE.Matrix4(),Q=new THREE.Quaternion(),S=new THREE.Vector3(1,1,1),P=new THREE.Vector3(),C=new THREE.Color();
function voxels(list,mat,parent=scene,shadow=true){
  const im=new THREE.InstancedMesh(box,mat,list.length);
  list.forEach((v,i)=>{P.set(v[0],v[1],v[2]);S.setScalar(1);M.compose(P,Q,S);im.setMatrixAt(i,M);if(v[3]!==undefined){C.set(v[3]);im.setColorAt(i,C);}});
  im.castShadow=im.receiveShadow=shadow;parent.add(im);total+=list.length;return im;}
const marble=new THREE.MeshStandardMaterial({roughness:.35,metalness:.05});
const gold=new THREE.MeshStandardMaterial({color:0xffc94a,roughness:.25,metalness:1});
const neon=new THREE.MeshStandardMaterial({color:0x2299ff,emissive:0x1a8cff,emissiveIntensity:3});
const h=(x,y,z)=>{const s=Math.sin(x*12.9898+y*78.233+z*37.719)*43758.5453;return s-Math.floor(s);};
const noise=(x,z)=>Math.sin(x*.21)*Math.cos(z*.17)+Math.sin((x+z)*.09)*1.4;

// остров
const isl=[],gld=[];const R=42;
for(let x=-R;x<=R;x++)for(let z=-R;z<=R;z++){
  const d=Math.hypot(x,z);const edge=R+noise(x,z)*3;if(d>edge)continue;
  const top=Math.round(2+noise(x*1.3,z*1.3)*.8+(d<14?-1:0));
  const depth=Math.round((1-d/edge)**1.6*46+h(x,0,z)*4);
  for(let y=top-depth;y<=top;y++){
    const vein=Math.abs(Math.sin(x*.35+y*.5+Math.cos(z*.3)*2))<.07;
    if(vein&&y<top)gld.push([x,y,z]);
    else{const g=0.86+h(x,y,z)*0.14;const c=new THREE.Color(g,g,g);if(h(z,y,x)>.97)c.setRGB(.7,.72,.78);isl.push([x,y,z,c.getHex()]);}
  }}
for(let a=0;a<Math.PI*2;a+=0.012)for(const r of [16,28,36])gld.push([Math.round(Math.cos(a)*r),3,Math.round(Math.sin(a)*r)]);
for(let i=0;i<12;i++){const a=i/12*Math.PI*2;for(let r=16;r<36;r++)gld.push([Math.round(Math.cos(a)*r),3,Math.round(Math.sin(a)*r)]);}
for(let i=0;i<16;i++){const a=i/16*Math.PI*2,cx=Math.round(Math.cos(a)*32),cz=Math.round(Math.sin(a)*32);
  for(let y=3;y<18;y++)for(let dx=-1;dx<=1;dx++)for(let dz=-1;dz<=1;dz++){
    if(y===3||y===17)gld.push([cx+dx,y,cz+dz]);else if(Math.abs(dx)+Math.abs(dz)<2||y%4===0)isl.push([cx+dx,y,cz+dz,0xf4f2ee]);}}
voxels(isl,marble);voxels(gld,gold);

// ядро
const core=[];for(let x=-7;x<=7;x++)for(let y=-7;y<=7;y++)for(let z=-7;z<=7;z++){const d=Math.hypot(x,y,z);if(d<=7&&d>5.6)core.push([x,y,z]);}
const coreG=new THREE.Group();coreG.position.set(0,16,0);scene.add(coreG);voxels(core,neon,coreG,false);
const inner=new THREE.Mesh(new THREE.IcosahedronGeometry(5.2,1),new THREE.MeshBasicMaterial({color:0x9fe0ff}));coreG.add(inner);
const ped=[];for(let y=3;y<9;y++){const r=10-y*0.6;for(let x=-11;x<=11;x++)for(let z=-11;z<=11;z++){const d=Math.hypot(x,z);if(d<=r&&d>r-1.5)ped.push([x,y,z]);}}voxels(ped,gold);

// кольца
const rings=[];
function ring(R,thick,axis,speed,mat,teeth){
  const g=new THREE.Group();g.position.set(0,16,0);const L=[];
  for(let a=0;a<Math.PI*2;a+=0.55/R)for(let t=-thick;t<=thick;t++)for(let w=-1;w<=1;w++){
    const tooth=teeth&&Math.sin(a*teeth)>0.6&&t===thick?1.6:0;
    const rr=R+t+tooth;L.push([Math.cos(a)*rr,w,Math.sin(a)*rr]);}
  voxels(L,mat,g,false);g.rotation.set(axis[0],axis[1],axis[2]);scene.add(g);rings.push({g,speed});}
ring(11,1,[0.3,0,0],0.6,gold,24);ring(14,0,[1.3,0.4,0],-0.45,neon);ring(17,1,[0.9,-0.6,0.2],0.3,gold,36);ring(20,0,[-0.4,1.1,0],-0.25,neon);ring(23,1,[1.57,0,0.5],0.18,gold,48);

// платформы
const plats=[];
for(let i=0;i<14;i++){const a=i/14*Math.PI*2+h(i,1,2),r=55+h(i,2,3)*30,y=-10+h(i,3,4)*45;
  const g=new THREE.Group();g.position.set(Math.cos(a)*r,y,Math.sin(a)*r);
  const type=i%3,s=4+Math.floor(h(i,5,6)*4),L=[],G=[];
  for(let x=-s;x<=s;x++)for(let z=-s;z<=s;z++)for(let yy=-s;yy<=0;yy++){
    const ok=type===0?Math.abs(x)+Math.abs(z)<=s+yy:type===1?Math.max(Math.abs(x),Math.abs(z))<=s+yy*0.7:Math.hypot(x,z)<=s+yy*0.8;
    if(!ok)continue;const edge=yy===0&&(Math.abs(x)+Math.abs(z)>=s-1||Math.max(Math.abs(x),Math.abs(z))===s);
    (edge||yy===-s+1?G:L).push([x,yy,z,0xf2f0ec]);}
  for(let k=1;k<=3;k++)G.push([0,k,0]);
  voxels(L,marble,g);voxels(G,gold,g);
  const n=new THREE.Mesh(new THREE.BoxGeometry(1.2,1.2,1.2),neon);n.position.y=4.5;g.add(n);
  scene.add(g);plats.push({g,y,ph:h(i,9,9)*6,rs:(h(i,7,7)-.5)*.6,n});}

// лучи
const beamMat=new THREE.MeshBasicMaterial({color:0x3fb6ff,transparent:true,opacity:.18,blending:THREE.AdditiveBlending,depthWrite:false,side:THREE.DoubleSide});
const beams=[];
const mainBeam=new THREE.Mesh(new THREE.CylinderGeometry(2.2,4,900,32,1,true),beamMat.clone());mainBeam.position.y=470;scene.add(mainBeam);beams.push(mainBeam);
const down=new THREE.Mesh(new THREE.CylinderGeometry(3,0.5,600,24,1,true),beamMat.clone());down.position.y=-330;down.material.opacity=.08;scene.add(down);
for(let i=0;i<16;i++){const a=i/16*Math.PI*2;const b=new THREE.Mesh(new THREE.CylinderGeometry(.35,.6,700,8,1,true),beamMat.clone());
  b.position.set(Math.cos(a)*32,368,Math.sin(a)*32);scene.add(b);beams.push(b);}

// звёзды и искры
const pg=new THREE.BufferGeometry(),pn=4000,pp=new Float32Array(pn*3);
for(let i=0;i<pn;i++){const r=150+Math.random()*700,t=Math.random()*Math.PI*2,p=Math.acos(2*Math.random()-1);pp.set([r*Math.sin(p)*Math.cos(t),r*Math.cos(p),r*Math.sin(p)*Math.sin(t)],i*3);}
pg.setAttribute('position',new THREE.BufferAttribute(pp,3));scene.add(new THREE.Points(pg,new THREE.PointsMaterial({color:0x9fcfff,size:1.2})));
const sg=new THREE.BufferGeometry(),sn=600,sp=new Float32Array(sn*3);
for(let i=0;i<sn;i++)sp.set([(Math.random()-.5)*30,Math.random()*120,(Math.random()-.5)*30],i*3);
sg.setAttribute('position',new THREE.BufferAttribute(sp,3));
scene.add(new THREE.Points(sg,new THREE.PointsMaterial({color:0x66ccff,size:.5,blending:THREE.AdditiveBlending,transparent:true})));

document.getElementById('cnt').textContent='Вокселей: '+total.toLocaleString('ru-RU');

const composer=new EffectComposer(renderer);composer.addPass(new RenderPass(scene,camera));
composer.addPass(new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),1.1,0.6,0.82));

const clock=new THREE.Clock();
renderer.setAnimationLoop(()=>{
  const t=clock.getElapsedTime();
  rings.forEach((r,i)=>{r.g.rotateY(r.speed*0.016);r.g.rotateX(Math.sin(t*.3+i)*0.002);});
  coreG.rotation.y=t*.4;coreG.rotation.x=t*.25;inner.scale.setScalar(1+Math.sin(t*3)*.06);
  coreLight.intensity=800+Math.sin(t*3)*200;
  plats.forEach(p=>{p.g.position.y=p.y+Math.sin(t*.6+p.ph)*2.5;p.g.rotation.y+=p.rs*.01;p.n.rotation.set(t,t*1.3,0);});
  beams.forEach((b,i)=>b.material.opacity=(i?0.09:0.16)+Math.sin(t*2+i)*0.04);
  const a=sg.attributes.position;for(let i=0;i<sn;i++){let y=a.getY(i)+0.25;if(y>120)y=0;a.setY(i,y);}a.needsUpdate=true;
  controls.update();composer.render();});
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);composer.setSize(innerWidth,innerHeight);});
</script></body></html>
